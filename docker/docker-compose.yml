version: "3.7"

services:
  postgres:
    container_name: iris-postgres
    build:
      context: ./postgres
    environment:
      POSTGRES_PASSWORD: root
    volumes:
      - pgdatas:/var/lib/postgresql/data
    ports:
      - 5432:5432

  redis:
    container_name: iris-redis
    image: redis:latest
    restart: always
    ports:
      - 6379:6379

volumes:
  pgdatas:
